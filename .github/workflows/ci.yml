name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install flake8==7.4.1
      - run: flake8 .

  test:
    runs-on: ubuntu-latest
    container: python:3.13-slim
    env:
      APP_HDF5_DRIVE_ID: dummy
      APP_HDF5_VERSION: dummy
      APP_PINCODE: dummy
      DJANGO_SECRET_KEY: test-only-not-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install pipenv==2026.10.3
      - run: pipenv install --deploy --system
      - name: Check that requirements.txt matches Pipfile.lock
        run: pipenv requirements | diff - requirements.txt
      - run: python manage.py test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --no-deps --disable-pip -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - run: ./scripts/docker-smoke-test.sh
